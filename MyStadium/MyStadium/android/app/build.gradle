apply plugin: 'com.android.application'

// Added signing config template and instructions
// You must add your keystore file to android/app/ and set the passwords in android/gradle.properties or ~/.gradle/gradle.properties
// Example properties to add to gradle.properties:
// MYAPP_RELEASE_STORE_FILE=my-release-key.keystore
// MYAPP_RELEASE_KEY_ALIAS=my-key-alias
// MYAPP_RELEASE_STORE_PASSWORD=your_store_password
// MYAPP_RELEASE_KEY_PASSWORD=your_key_password

android {
 compileSdk 33
 namespace "com.mystadium"
  signingConfigs {
    release {
      if (project.hasProperty('MYAPP_RELEASE_STORE_FILE')) {
        storeFile file(MYAPP_RELEASE_STORE_FILE)
        storePassword MYAPP_RELEASE_STORE_PASSWORD
        keyAlias MYAPP_RELEASE_KEY_ALIAS
        keyPassword MYAPP_RELEASE_KEY_PASSWORD
      }
    }
  }

  buildTypes {
    release {
      signingConfig signingConfigs.release
      minifyEnabled false
      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
  }
}
