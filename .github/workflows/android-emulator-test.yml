name: Android Emulator Test

# Prueba la APK en un emulador Android en la nube y captura logcat + captura de pantalla.
# Se lanza manualmente (workflow_dispatch) o al hacer push a main / fix/android-build.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/android-build

jobs:
  emulator-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: MyStadium/package-lock.json

      - name: Instalar dependencias JS
        working-directory: MyStadium
        run: npm ci --legacy-peer-deps

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK (emulador + imagen x86_64)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          set -o pipefail
          # Las plataformas 37.0/37.1/37.2 y build-tools;37.0.0 YA vienen en el
          # runner; no las pedimos a sdkmanager (a veces el id exacto 'android-37'
          # no se encuentra y aborta todo el lote). Instalación tolerante por paquete.
          for pkg in \
            "platform-tools" \
            "emulator" \
            "platforms;android-34" \
            "system-images;android-34;google_apis;x86_64" \
            "cmake;3.22.1" \
            "ndk;27.1.12297006" \
          ; do
            logfile="/tmp/sdk-$(echo "$pkg" | tr ';:' '__').log"
            "$SDKMANAGER" --install "$pkg" >"$logfile" 2>&1 \
              || echo "AVISO: '$pkg' no disponible (ya instalado o no descargable); lo validará el build."
          done
          echo "=== estado SDK (diagnóstico) ==="
          "$SDKMANAGER" --list 2>/dev/null | grep -E "platforms;android-3[0-9]|build-tools;3[0-9]|system-images;android-34" | head -40 || true

      - name: Cachear Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('MyStadium/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Compilar APK release para emulador (x86_64)
        working-directory: MyStadium/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon --stacktrace

      - name: Verificar KVM
        shell: bash
        run: |
          ls -la /dev/kvm || (sudo apt-get update && sudo apt-get install -y qemu-kvm && ls -la /dev/kvm)

      - name: Crear y arrancar emulador
        shell: bash
        timeout-minutes: 12
        run: |
          AVD="test"
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
          # Ruta fija del AVD: evita el bug de runners donde HOME se
          # sobreescribe en mitad del job y el emulador no encuentra el AVD.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "=== accel-check ==="
          "$ANDROID_HOME/emulator/emulator" -accel-check || true
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -n "$AVD" -k "system-images;android-34;google_apis;x86_64" --force 2>&1 | tail -5
          echo "=== AVDs detectados ==="
          "$ANDROID_HOME/emulator/emulator" -list-avds || true
          ls -la "$ANDROID_AVD_HOME/" || true
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD" \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -no-audio \
            -no-boot-anim \
            -no-metrics \
            -accel auto \
            -memory 2048 \
            > /tmp/emulator.log 2>&1 &
          EMUPID=$!
          echo "emulador PID=$EMUPID lanzado, esperando arranque..."
          adb start-server || true
          sleep 30
          echo "=== log emulador a los 30s ==="
          tail -40 /tmp/emulator.log || true
          BOOTED=0
          for i in $(seq 1 40); do
            STATE=$(adb devices | sed -n 2p)
            boot=$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            echo "[t+$((3*10 + i*10))s] adb='$STATE' boot='$boot' pid_alive=$(kill -0 "$EMUPID" 2>/dev/null && echo si || echo no)"
            if [ "$boot" = "1" ]; then BOOTED=1; echo "BOOT COMPLETADO"; break; fi
            if ! kill -0 "$EMUPID" 2>/dev/null; then
              echo "¡EL EMULADOR SE CERRÓ!"; break
            fi
            sleep 10
          done
          echo "=== log emulador (final) ==="
          tail -60 /tmp/emulator.log || true
          adb shell input keyevent 82 || true
          echo "=== adb devices ==="
          adb devices || true

      - name: Instalar y abrir la app
        shell: bash
        run: |
          adb install -r MyStadium/android/app/build/outputs/apk/release/app-release.apk
          adb shell am force-stop com.mystadium
          sleep 2
          adb shell am start -n com.mystadium/.MainActivity
          echo "app abierta, esperando 30s por si hay error de JS..."

      - name: Capturar log y pantalla
        shell: bash
        run: |
          sleep 30
          mkdir -p /tmp/diagnostico
          adb logcat -d > /tmp/diagnostico/logcat.txt
          adb exec-out screencap -p > /tmp/diagnostico/pantalla.png
          echo "=== proceso de la app ==="
          adb shell "ps -A | grep mystadium" || echo "PROCESO NO ENCONTRADO (app cerrada)"
          echo "=== actividad en primer plano ==="
          adb shell "dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity'"
          echo "=== errores de JS / nativos ==="
          grep -E "ReactNativeJS|AndroidRuntime|FATAL|mystadium|Unable to load|could not be found|Invariant" /tmp/diagnostico/logcat.txt | tail -60 || echo "(sin errores coincidentes)"
          echo "=== último tramo del log ==="
          tail -40 /tmp/diagnostico/logcat.txt
          echo "=== verificación final: la app debe seguir viva ==="
          if ! adb shell "ps -A | grep -q mystadium"; then
            echo "FALLO: la app se cerró tras el arranque"
            exit 1
          fi
          echo "OK: la app sigue en ejecución"

      - name: Subir diagnóstico como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-emulador
          path: /tmp/diagnostico
          retention-days: 30