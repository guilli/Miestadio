name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: MyStadium/package-lock.json

      - name: Instalar dependencias JS
        working-directory: MyStadium
        run: npm ci --legacy-peer-deps

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;37.0.0" \
            "cmake;3.22.1" \
            "ndk;27.1.12297006"

      - name: Cachear Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('MyStadium/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dar permisos a gradlew
        working-directory: MyStadium/android
        run: chmod +x gradlew

      - name: Debug React Native CLI
        run: |
          pwd
          find . -name package.json | sort
          cat react-native.config.js
          npx @react-native-community/cli config || true

      - name: Compilar APK debug
        working-directory: MyStadium/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace --info

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MyStadium-release-APK
          path: MyStadium/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
