name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - limpia

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: MiestadioApp/package-lock.json

      - name: Instalar dependencias JS
        working-directory: MiestadioApp
        run: npm ci

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Cachear Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('MiestadioApp/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dar permisos a gradlew
        working-directory: MiestadioApp/android
        run: chmod +x gradlew

      - name: Compilar APK debug
        working-directory: MiestadioApp/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MiEstadio-debug-APK
          path: MiestadioApp/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
