name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - limpia

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: MiestadioApp
        run: npm install

      - name: Expo Prebuild
        working-directory: MiestadioApp
        run: npx expo prebuild --platform android --no-install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        working-directory: MiestadioApp/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiEstadio-APK
          path: MiestadioApp/android/app/build/outputs/apk/debug/app-debug.apk
